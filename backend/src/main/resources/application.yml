spring:
  config:
    import: optional:file:../dev.local.properties[.properties]
  datasource:
    url: ${APP_DATABASE_URL:jdbc:postgresql://localhost:5432/simple_arpg}
    username: ${APP_DATABASE_USERNAME:postgres}
    password: ${APP_DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  address: ${APP_SERVER_ADDRESS:127.0.0.1}
  port: ${APP_PORT:8080}

app:
  request-size:
    auth-json-max: ${APP_REQUEST_SIZE_AUTH_JSON_MAX:16KB}
    api-json-max: ${APP_REQUEST_SIZE_API_JSON_MAX:1MB}
  security:
    production-mode: ${APP_SECURITY_PRODUCTION_MODE:false}
  client:
    allowed-origin-patterns: ${APP_CLIENT_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,capacitor://localhost,ionic://localhost}
  auth:
    client-address:
      trust-forward-headers: ${APP_AUTH_TRUST_FORWARD_HEADERS:false}
    rate-limit:
      register:
        enabled: ${APP_AUTH_REGISTER_RATE_LIMIT_ENABLED:true}
        max-attempts-per-ip: ${APP_AUTH_REGISTER_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:10}
        max-attempts-per-email: ${APP_AUTH_REGISTER_RATE_LIMIT_MAX_ATTEMPTS_PER_EMAIL:5}
        window: ${APP_AUTH_REGISTER_RATE_LIMIT_WINDOW:1m}
      login:
        enabled: ${APP_AUTH_LOGIN_RATE_LIMIT_ENABLED:true}
        max-attempts-per-ip: ${APP_AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_IP:8}
        max-attempts-per-email: ${APP_AUTH_LOGIN_RATE_LIMIT_MAX_ATTEMPTS_PER_EMAIL:5}
        window: ${APP_AUTH_LOGIN_RATE_LIMIT_WINDOW:1m}
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-before-production}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:86400}
